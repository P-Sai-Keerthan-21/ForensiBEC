<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FORENSIBEC{% endblock %}</title>
<style>
  :root { --bg:#0f172a; --panel:#fff; --ink:#0f172a; --muted:#64748b;
          --line:#e2e8f0; --accent:#1d4ed8; --page:#f1f5f9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--ink);
         font:15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif; }
  header { background:var(--bg); color:#fff; }
  header .inner { max-width:1080px; margin:0 auto; padding:18px 24px 0; }
  .brand { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .brand h1 { font-size:23px; margin:0; letter-spacing:.06em; font-weight:700; }
  .brand p { margin:0; color:#94a3b8; font-size:12.5px; text-transform:uppercase; letter-spacing:.09em; }
  nav.main { display:flex; gap:4px; margin-top:12px; flex-wrap:wrap; }
  nav.main a { color:#cbd5e1; text-decoration:none; padding:9px 14px; font-size:14px;
               border-radius:7px 7px 0 0; }
  nav.main a:hover { color:#fff; background:#1e293b; }
  nav.main a.active { background:var(--page); color:var(--ink); font-weight:600; }
  nav.main form { margin-left:auto; padding:4px 0; }
  nav.main input { padding:6px 10px; border-radius:6px; border:1px solid #334155;
                   background:#1e293b; color:#fff; font-size:13px; width:230px; }
  .wrap { max-width:1080px; margin:0 auto; padding:26px 24px 56px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           padding:22px; margin-bottom:18px; }
  h2 { font-size:14px; margin:0 0 14px; text-transform:uppercase; letter-spacing:.06em;
       color:var(--muted); border-bottom:1px solid var(--line); padding-bottom:8px; }
  h3 { margin:0 0 4px; font-size:19px; }
  label { display:block; font-weight:600; font-size:12px; margin:12px 0 5px;
          text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  input[type=text], input[type=file] { width:100%; padding:10px 12px; border:1px solid #cbd5e1;
          border-radius:7px; font-size:14px; font-family:inherit; background:#fff; }
  .row { display:flex; gap:16px; flex-wrap:wrap; } .row > div { flex:1; min-width:210px; }
  button, .btn { display:inline-block; padding:11px 18px; background:var(--accent); color:#fff;
          border:0; border-radius:7px; font-size:14.5px; font-weight:600; cursor:pointer;
          font-family:inherit; text-decoration:none; }
  button:hover, .btn:hover { background:#1e40af; }
  .btn.secondary { background:#fff; color:var(--accent); border:1px solid #bfdbfe; }
  .btn.secondary:hover { background:#eff6ff; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .table-wrap { overflow-x:auto; }
  code, .mono { font-family:Consolas, monospace; font-size:12.5px; word-break:break-word; }
  .band { display:inline-block; padding:2px 10px; border-radius:999px; font-weight:650;
          font-size:11.5px; letter-spacing:.03em; white-space:nowrap; }
  .band-CONFIRMED_BEC { color:#7f1d1d; background:#fee2e2; }
  .band-LIKELY_BEC { color:#9a3412; background:#ffedd5; }
  .band-SUSPICIOUS { color:#854d0e; background:#fef9c3; }
  .band-BENIGN { color:#166534; background:#dcfce7; }
  .muted, .small { color:var(--muted); font-size:13px; }
  .note { background:#fefce8; border:1px solid #fde68a; border-radius:7px; padding:11px 14px;
          font-size:13px; color:#713f12; }
  .sec { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:7px; padding:11px 14px;
         font-size:13px; color:#14532d; }
  .bad { background:#fef2f2; border:1px solid #fecaca; color:#7f1d1d; border-radius:7px; padding:11px 14px; }
  .ok { color:#166534; font-weight:650; } .fail { color:#b91c1c; font-weight:650; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .stat { border:1px solid var(--line); border-radius:9px; padding:12px 14px; background:#fff; }
  .stat .n { font-size:22px; font-weight:650; } .stat .l { color:var(--muted); font-size:11.5px;
          text-transform:uppercase; letter-spacing:.04em; }
  .steps { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .step { flex:1; min-width:120px; background:#fff; border:1px solid var(--line);
          border-left:3px solid var(--accent); border-radius:7px; padding:9px 12px; font-size:12px; }
  .step b { display:block; font-size:13px; } .step span { color:var(--muted); }
  .pill { display:inline-block; background:#f1f5f9; border:1px solid var(--line); border-radius:5px;
          padding:1px 7px; margin:2px 3px 2px 0; font-family:Consolas, monospace; font-size:11.5px;
          word-break:break-all; }
  a { color:var(--accent); }
  footer { color:var(--muted); font-size:12.5px; margin-top:22px; }
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="brand">
      <h1>FORENSIBEC</h1>
      <p>Business Email Compromise &mdash; Detection &amp; Digital Investigation</p>
    </div>
    <nav class="main">
      <a href="/" class="{{ 'active' if active == 'intake' else '' }}">Evidence intake</a>
      <a href="/cases" class="{{ 'active' if active == 'cases' else '' }}">Cases</a>
      <a href="/about" class="{{ 'active' if active == 'about' else '' }}">Method &amp; limits</a>
      <form action="/search" method="get" role="search">
        <input type="search" name="q" value="{{ query or '' }}" maxlength="200"
               placeholder="Search cases, IOCs, senders" aria-label="Search">
      </form>
    </nav>
  </div>
</header>
<div class="wrap">
{% block content %}{% endblock %}
<footer>
  FORENSIBEC v{{ version }} &middot; runs locally; evidence is never sent to an external
  service &middot; JSON API: <code>POST /api/analyse</code>, <code>GET /api/cases</code>,
  <code>GET /api/health</code>
</footer>
</div>
</body>
</html>
